# 稳定的评测用例标识，与文件名一致。
id: design-lock
# 验证读取结果前的设计锁定与证据等级。
title: 在读取结果前锁定实验设计
description: 结果尚未产生，回答需要给出可执行的设计锁定卡并披露回顾性锁定规则。

input:
  # 发送给 Agent 的中文设计锁定请求。
  prompt: |
    我们准备比较结构化记忆与固定基线，结果还没有产生。团队想在看到结果后调整主要指标和样本排除规则。请用中文按“设计锁定”“证据等级”“变更规则”三部分回答，列出读取结果前需要固定的字段，说明回顾性锁定如何处理，并给出 E1—E4 的证据等级选择。

# 检查回答是否具备指定结构。
expect:
  must_contain: ["设计锁定", "证据等级", "变更规则"]

judge:
  # 使用确定性规则检查锁定字段、回顾性披露和等级边界。
  type: rule_based
  success:
    - output_contains:
        all: ["设计锁定", "主要指标", "数据快照", "随机种子", "否证"]
    - output_contains:
        any: ["回顾性", "形成时间", "结果产生后"]
    - output_contains:
        all: ["E1", "E2", "E3", "E4"]
    - output_contains:
        any: ["新协议", "新运行", "重新锁定"]
