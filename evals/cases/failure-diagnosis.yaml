# 稳定的评测用例标识，与文件名一致。
id: failure-diagnosis
# 验证失败保留与最小诊断。
title: 根据执行诊断处理部分失败
description: 部分任务超时，下一步需要区分故障类型并保留失败记录。

input:
  # 发送给 Agent 的单轮中文失败诊断请求。
  prompt: |
    一次十二任务实验中有三个任务超时，其余任务已经产生结果。有人建议删除三个失败任务并直接把预算扩大十倍。
    请用中文给出诊断和下一步，严格使用“诊断”“下一步”“记录”三个标题。要求先定位原因，保留失败状态，并设计能够区分基础设施故障与研究假设未获支持的最小检查。

# 检查回答是否具备指定结构。
expect:
  must_contain: ["诊断", "下一步", "记录"]

judge:
  # 使用确定性规则检查失败保留和最小诊断。
  type: rule_based
  success:
    - output_contains:
        all: ["保留", "基础设施", "失败"]
    - output_contains:
        any: ["最小", "仅重跑", "配对对照", "健康检查", "小规模"]
