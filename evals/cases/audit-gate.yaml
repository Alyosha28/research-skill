# 稳定的评测用例标识，与文件名一致。
id: audit-gate
# 验证高危问题未关闭时的发布拦截。
title: 在高危问题未关闭时阻止发布
description: 审计报告包含未关闭的高严重度问题和失败命令，回答需要拒绝发布并给出修复路径。

input:
  # 发送给 Agent 的中文发布审计请求。
  prompt: |
    发布前审计发现一个高危问题仍为 open，两个验证命令返回非零，报告绑定的是上一个提交，之后又改过代码。请用中文按“判定”“门槛”“修复”三部分回答，说明当前能否发布、报告需要记录什么，以及修复后的提交如何处理。

# 检查回答是否具备指定结构。
expect:
  must_contain: ["判定", "门槛", "修复"]

judge:
  # 使用确定性规则检查发布拦截、报告字段和重新审计。
  type: rule_based
  success:
    - output_contains:
        any: ["不能发布", "阻止发布", "发布失败", "不通过"]
    - output_contains:
        all: ["高危", "提交"]
    - output_contains:
        any: ["返回码", "return_code", "命令返回"]
    - output_matches:
        any: ["(新|重新).{0,8}(审计|报告)", "新提交", "独立提交", "重新绑定"]
