# 稳定的评测用例标识，与文件名一致。
id: matched-experiment
# 验证配对对照和否证条件。
title: 在覆盖差异下设计共同样本对照
description: 两个条件覆盖范围不同，主要比较必须采用共同可评估样本。

input:
  # 发送给 Agent 的单轮中文实验设计请求。
  prompt: |
    我们正在比较“增加结构化记忆”与固定基线。两个条件已有结果的覆盖任务不同，团队还想在看到结果后改选最有利指标。
    请用中文设计一个可证伪的小实验，严格使用“研究问题”“假设”“对照”“评价”“判定”五个标题。说明共同可评估样本、共享预算、随机种子、事先固定的主要指标、否证条件以及失败结果的处理方式。

# 为需要完整实验设计的回答提供充足执行时间。
constraints:
  timeout_seconds: 540

# 检查回答是否具备指定结构。
expect:
  must_contain: ["研究问题", "假设", "对照", "评价", "判定"]

judge:
  # 使用确定性规则检查共同支持、固定比较和否证条件。
  type: rule_based
  success:
    - output_contains:
        all: ["共同可评估样本", "主要指标", "否证", "失败"]
    - output_matches:
        any: ["随机种子", "种子[^\\n]{0,20}(固定|冻结|相同|一一配对)", "seed"]
    - output_matches:
        any: ["(事先|预先|运行前|结果前)[^\\n]{0,20}(固定|冻结)", "读取[^\\n]{0,20}前[^\\n]{0,20}(固定|冻结)"]
