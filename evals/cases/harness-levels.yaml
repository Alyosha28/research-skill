# 稳定的评测用例标识，与文件名一致。
id: harness-levels
# 验证候选产出与研究执行系统证据保持分离。
title: 区分候选搜索与研究执行系统
description: 候选数量增加不能直接证明研究执行系统改进。

input:
  # 发送给 Agent 的中文研究层次分析请求。
  prompt: |
    一个研究代理这周生成了更多候选，所以我认为它的研究执行系统已经改进。请用中文按“研究层次”“需要的对照”“当前判定”三部分分析，区分候选搜索与研究执行系统，明确说明共同可评估样本和预算控制，并说明需要什么证据。

# 检查回答是否具备指定结构。
expect:
  must_contain: ["研究层次", "需要的对照", "当前判定"]

judge:
  # 使用确定性规则检查两个层次、匹配对照和结论边界。
  type: rule_based
  success:
    - output_contains:
        all: ["候选搜索", "研究执行系统"]
    - output_contains:
        any: ["共同支持", "共同可评估样本", "共同可评估", "共同可评价", "共同任务", "相同任务集", "配对比较"]
    - output_contains:
        any: ["预算", "资源消耗", "运行时长", "模型调用次数"]
    - output_contains:
        any: ["无法判定", "不能证明", "不足以", "证据不足", "无法确认"]
