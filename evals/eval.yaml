# skill-up 配置结构版本，保持原值。
schema_version: v1alpha1

environment:
  # 纯文本研究任务不需要沙箱。
  type: none

skills:
  - source: local_path
    path: .
    include: [SKILL.md, "references/**", "assets/**", "scripts/**"]
    exclude: ["**/._*", "**/__pycache__/**", "**/*.pyc"]

engine:
  # 使用本机已有登录状态的 Agent Engine。
  name: claude_code

cases:
  # 本次验证包含的研究行为用例。
  files:
    - evals/cases/evidence-boundaries.yaml
    - evals/cases/matched-experiment.yaml
    - evals/cases/failure-diagnosis.yaml
    - evals/cases/harness-levels.yaml
    - evals/cases/route-control.yaml
    - evals/cases/memory-usage.yaml
    - evals/cases/budget-recovery.yaml
    - evals/cases/compose-tradeoff.yaml
    - evals/cases/design-lock.yaml
    - evals/cases/audit-gate.yaml
    - evals/cases/trigger-research.yaml
    - evals/cases/trigger-near-miss.yaml
  defaults:
    timeout_seconds: 540
    max_turns: 3
    # 所有用例共用的低成本前置检查。
    expect:
      exit_code: 0
      must_not_contain:
        - "TODO"
  # 用例串行运行，避免并发模型请求造成基础设施超时。
  parallelism: 1

report:
  # 每次运行生成的报告格式。
  formats: [json]
  artifacts: [transcript]
